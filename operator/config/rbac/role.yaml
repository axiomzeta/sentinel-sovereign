# RBAC the operator needs: read/patch CRs (+ /status), own the Deployment/Service it creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: axiomzetasentinel-operator
rules:
  - apiGroups: ["platform.axiomzetasentinel.io"]
    resources: ["axiomzetasentinelgateways"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["platform.axiomzetasentinel.io"]
    resources: ["axiomzetasentinelgateways/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axiomzetasentinel-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: axiomzetasentinel-operator
subjects:
  - kind: ServiceAccount
    name: axiomzetasentinel-operator
    namespace: axiomzetasentinel-system

apiVersion: platform.axiomzetasentinel.io/v1alpha1
kind: AxiomZetaSentinelGateway
metadata:
  name: axiom-zeta-sentinel-enterprise
spec:
  image: ghcr.io/anthonyrenecastro-create/axiom-zeta-sentinel-sovereign:latest
  replicas: 3
  tenantRuntimeCacheEnabled: false
  auth:
    mode: oidc
    # secretName: axiom-zeta-sentinel-gateway-secrets  # Secret with GATEWAY_API_KEY, OIDC_CLIENT_SECRET, OIDC_SESSION_SECRET
    oidcIssuer: https://idp.example.com
    oidcAudience: axiom-zeta-sentinel-sovereign
    oidcJwksUrl: https://idp.example.com/.well-known/jwks.json
    oidc:
      sessionTtlSeconds: 3600
      sessionMaxLifetimeSeconds: 86400
      auditLogPath: /var/log/axiom-zeta-sentinel/auth-audit.jsonl
      auditLogMaxBytes: 10485760
      auditLogBackupCount: 5
    requiredGroups:
      - axiom-zeta-sentinel-users
    groupRoleMap:
      - axiom-zeta-sentinel-admins:admin
      - axiom-zeta-sentinel-analysts:analyst
  highAvailability:
    enabled: true
    minAvailable: 2
  airgap:
    enabled: true
    allowOutboundNetwork: false
    allowedHosts:
      - idp.example.com
      - opa.svc.cluster.local
  policy:
    mode: opa
    defaultDecision: deny
    decisionLogPath: /var/log/axiom-zeta-sentinel/policy-decisions.jsonl
    bundleConfigMapName: axiom-zeta-sentinel-policy-bundle

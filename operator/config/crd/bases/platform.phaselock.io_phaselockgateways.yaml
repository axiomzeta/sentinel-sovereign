apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: axiomzetasentinelgateways.platform.axiomzetasentinel.io
spec:
  group: platform.axiomzetasentinel.io
  scope: Namespaced
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions:
        - v1
      clientConfig:
        service:
          namespace: axiomzetasentinel-system
          name: axiomzetasentinel-operator-webhook
          path: /convert-platform-axiomzetasentinel-io
        caBundle: ""
  names:
    plural: axiomzetasentinelgateways
    singular: axiomzetasentinelgateway
    kind: AxiomZetaSentinelGateway
    shortNames:
      - plg
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                image:
                  type: string
                replicas:
                  type: integer
                  minimum: 1
                tenantRuntimeCacheEnabled:
                  type: boolean
                auth:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [api_key, oidc]
                    secretName:
                      type: string
                      description: >-
                        Name of a Secret in the CR's namespace holding GATEWAY_API_KEY,
                        OIDC_CLIENT_SECRET and OIDC_SESSION_SECRET. The operator injects
                        them into the gateway Deployment via secretKeyRef.
                    oidcIssuer:
                      type: string
                    oidcAudience:
                      type: string
                    oidcJwksUrl:
                      type: string
                    requiredGroups:
                      type: array
                      items:
                        type: string
                    groupRoleMap:
                      type: array
                      items:
                        type: string
                    oidc:
                      type: object
                      properties:
                        sessionTtlSeconds:
                          type: integer
                          minimum: 60
                        sessionMaxLifetimeSeconds:
                          type: integer
                          minimum: 300
                        auditLogPath:
                          type: string
                        auditLogMaxBytes:
                          type: integer
                          minimum: 0
                        auditLogBackupCount:
                          type: integer
                          minimum: 0
                highAvailability:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    minAvailable:
                      type: integer
                      minimum: 1
                airgap:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                    allowOutboundNetwork:
                      type: boolean
                    allowedHosts:
                      type: array
                      items:
                        type: string
                policy:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [builtin, opa]
                    opaUrl:
                      type: string
                    bundleConfigMapName:
                      type: string
                    defaultDecision:
                      type: string
                      enum: [deny, allow]
                    decisionLogPath:
                      type: string
              required:
                - image
            status:
              type: object
              properties:
                phase:
                  type: string
                observedGeneration:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.phase
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
